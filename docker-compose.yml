version: '3.8'

services:
  # --- Backend Servisi ---
  api:
    build: ./backend
    container_name: social-media-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - EMAIL_USER=${EMAIL_USER} # .env dosyasından okuyacak
      - EMAIL_PASS=${EMAIL_PASS} # .env dosyasından okuyacak
      # Veritabanı Ayarları
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=sifre123
      - DB_NAME=social_portfolio
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      # Kod değişikliklerini anında görmek için (Geliştirme modu)
      - ./backend:/app
      - /app/node_modules
      # Fotoğrafları kaybetmemek için volume
      - ./backend/uploads:/app/uploads

  # --- Veritabanı Servisi (PostgreSQL) ---
  db:
    image: postgres:15-alpine
    container_name: social-media-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sifre123
      - POSTGRES_DB=social_portfolio
    volumes:
      # Veritabanı verilerini kalıcı hale getiriyoruz
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # İsterseniz yerel bilgisayarınızdan da DB'ye bağlanabilmek için

volumes:
  postgres_data:
