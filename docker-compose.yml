services:
  # --- Backend Servisi ---
  api:
    build: ./backend
    container_name: social-media-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      # Veritabanı Ayarları
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=sifre123
      - DB_NAME=social_portfolio
      - DB_PORT=5432
      # Redis Ayarları
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    volumes:
      # Kod değişikliklerini anında görmek için (Geliştirme modu)
      - ./backend:/app
      - /app/node_modules
      # Fotoğrafları kaybetmemek için volume
      - ./backend/uploads:/app/uploads

  # --- Frontend Servisi (Vite Dev Server) ---
  frontend:
    build: ./frontend
    container_name: social-media-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://api:5000
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # --- Redis Servisi (Bull Queue için) ---
  redis:
    image: redis:7-alpine
    container_name: social-media-redis
    ports:
      - "6379:6379"

  # --- Veritabanı Servisi (PostgreSQL) ---
  db:
    image: postgres:15-alpine
    container_name: social-media-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sifre123
      - POSTGRES_DB=social_portfolio
    volumes:
      # Veritabanı verilerini kalıcı hale getiriyoruz
      - postgres_data:/var/lib/postgresql/data
      # Tablo oluşturma scripti (ilk başlatmada çalışır)
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

volumes:
  postgres_data:
